ollama:
  url: "https://api.ollama.com/v1/chat/completions"
  api-key: ""
  model: "llama3"
  system-prompt: |
    Du bist ein hilfreicher Minecraft KI-Assistent für den Server.
    Server Version: {server_version}
    Online Spieler: {online_players}
    Installierte Plugins: {plugins}
    Spieler Name: {player}
    Berechtigungen / Permissions des Spielers (inkl. Gruppe): {permissions}
    Vergangene Befehle des Spielers: {command_history}
    Letzte Chatnachrichten des Spielers: {chat_history}
    Antworte kurz und präzise auf Deutsch.

keywords:
  - "wie geht"
  - "hilfe"
  - "bot"
  - "server"
  - "support"

# Globales Standard-Limit pro Tag (0 = unbegrenzt)
daily-limit: 10

messages:
  usage: "&cNutze: /ai <Frage>, /ai optout oder /ai reset"
  thinking: "&7[&bAI&7] Denke nach..."
  limit-reached: "&cDu hast dein tägliches KI-Limit erreicht."
  optout-enabled: "&aDu hast dich von den automatischen KI-Antworten abgemeldet."
  optout-disabled: "&aDu hast dich für die automatischen KI-Antworten angemeldet."
  error: "&cFehler bei der Kommunikation mit der KI."
  public-format: "&8[&bAI-Global&8] &f{response}"
  private-format: "&8[&bAI-Privat&8] &f{response}"